services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: calories_app
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
    environment:
      DATABASE_URL: postgresql+psycopg2://calories_user:strongpassword@db:5432/calories_db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: calories_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    depends_on:
      - app
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: calories_user
      POSTGRES_PASSWORD: strongpassword
      POSTGRES_DB: calories_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calories_user -d calories_db"]
      interval: 2s
      timeout: 2s
      retries: 10
    volumes:
      - calories_postgres_data:/var/lib/postgresql/data

volumes:
  calories_postgres_data: